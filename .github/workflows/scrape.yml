name: Scrape

on:
  workflow_dispatch:
    inputs:
      batch_label:
        description: "Result file: results/batch-<label>.jsonl"
        type: string
        required: true
      worker_count:
        description: "Number of parallel workers (will be floored to 40 to keep per-worker runtime short)"
        type: number
        default: 40
      max_age_weeks:
        description: "Only flag 1-star reviews newer than N weeks"
        type: number
        default: 4
      workers_per_runner:
        description: "Concurrent browser contexts per runner"
        type: number
        default: 10
      retry_count:
        description: "How many times this batch has been auto-retried (internal use)"
        type: number
        default: 0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      worker_count: ${{ steps.set.outputs.worker_count }}
    steps:
      - id: set
        run: |
          n=${{ inputs.worker_count }}
          # Floor at 40: shorter per-worker runtime keeps the headless browser
          # well below the ~2h death threshold we observed on the 2-core runners.
          if [ "$n" -lt 40 ]; then n=40; fi
          # Ceiling at 250: a job matrix can generate at most 256 jobs per run,
          # and exceeding it fails the whole run rather than degrading.
          if [ "$n" -gt 250 ]; then n=250; fi
          echo "matrix=$(seq 0 $((n-1)) | jq -Rsc 'split("\n")[:-1] | map(tonumber)')" >> "$GITHUB_OUTPUT"
          echo "worker_count=$n" >> "$GITHUB_OUTPUT"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    # Healthy workers finish in 89-111 min; past ~2h the headless browser has
    # died and the job just hangs. Without this it burns GitHub's 6h default
    # before being reaped, stalling the whole chain that long. Failing here is
    # safe: aggregate is `if: !cancelled()`, so it still commits the surviving
    # chunks and triggers the next batch.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        chunk_index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - run: |
          python worker.py \
            --chunk-index ${{ matrix.chunk_index }} \
            --chunk-count ${{ needs.prepare.outputs.worker_count }} \
            --max-age-weeks ${{ inputs.max_age_weeks }} \
            --workers ${{ inputs.workers_per_runner }} \
            --batch-label ${{ inputs.batch_label }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk_index }}
          path: results/chunk-*.jsonl
          if-no-files-found: ignore

  aggregate:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      err_pct: ${{ steps.stats.outputs.err_pct }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true

      - run: python aggregate.py --out results/batch-${{ inputs.batch_label }}.jsonl

      - id: stats
        name: Compute error rate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os, sys
          label = "${{ inputs.batch_label }}"
          path = f"results/batch-{label}.jsonl"
          total = errors = 0
          for line in open(path, encoding="utf-8"):
              line = line.strip()
              if not line: continue
              total += 1
              if json.loads(line).get("error"): errors += 1
          err_pct = (errors * 100 / total) if total else 0

          # err_pct cannot see a worker whose artifact never uploaded: that chunk
          # contributes zero rows, so it is absent from BOTH the numerator and the
          # denominator and the batch still reports 0.00%. Comparing against the
          # batch CSV is the only check that catches silent chunk loss.
          # csv.reader (not line counting) because a quoted embedded newline
          # otherwise inflates the count by one.
          with open(f"batches-public/batch-{label}.csv", encoding="utf-8",
                    errors="replace") as f:
              expected = sum(1 for _ in csv.reader(f)) - 1   # minus header
          missing = max(0, expected - total)
          missing_pct = (missing * 100 / expected) if expected else 0

          # A percentage threshold cannot police missing chunks: one lost chunk
          # is 1/worker_count of the batch (2.5% at 40 workers, 0.83% at 120),
          # so it always sits under the 5% error threshold. Historically batch
          # 333 (2.50%) and batch 287 (5.00%) both advanced as "0.00% errors".
          # Healthy batches match the CSV exactly, so use a small absolute
          # tolerance instead of a rate.
          MISSING_TOLERANCE = 10
          retry_needed = (err_pct > 5) or (missing > MISSING_TOLERANCE)

          print(f"err_pct={err_pct:.2f}")
          print(f"missing_pct={missing_pct:.2f}")
          print(f"expected={expected}")
          print(f"actual={total}")
          print(f"missing={missing}")
          print(f"retry_needed={'true' if retry_needed else 'false'}")
          # Human-readable summary to stderr so it lands in the log, not in
          # $GITHUB_OUTPUT (which this heredoc is redirected into).
          print(f"  expected={expected} actual={total} missing={missing} "
                f"errors={errors} err_pct={err_pct:.2f}% "
                f"missing_pct={missing_pct:.2f}%", file=sys.stderr, flush=True)
          if missing:
              print(f"  WARNING: {missing} rows missing — a chunk artifact is "
                    f"absent or truncated", file=sys.stderr, flush=True)
          PY

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/batch-${{ inputs.batch_label }}.jsonl
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "scrape: batch ${{ inputs.batch_label }} run ${{ github.run_id }} (errors: ${{ steps.stats.outputs.err_pct }}%)"
          # Another run may push to the branch while we scrape — rebase + retry
          # instead of dying on a non-fast-forward (a bare push here breaks the chain).
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed (attempt $attempt)"; exit 0; fi
            echo "push rejected (attempt $attempt) — fetch + rebase…"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done
          echo "push still failing after retries"; exit 1

      - name: Trigger next batch (retry or advance)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ inputs.batch_label }}"
          # retry_needed covers BOTH a high error rate and missing rows. Using
          # err_pct alone let a batch that silently lost whole chunks advance as
          # if clean, because an absent chunk contributes no rows to count.
          retry_needed="${{ steps.stats.outputs.retry_needed }}"
          err_pct="${{ steps.stats.outputs.err_pct }}"
          missing="${{ steps.stats.outputs.missing }}"
          retry_count=${{ inputs.retry_count }}
          # Retry same batch if defective and we've retried <2 times.
          # Otherwise advance to the next batch.
          if [ "$retry_needed" = "true" ] && [ "$retry_count" -lt 2 ]; then
            next="$current"
            next_retry=$((retry_count + 1))
            echo "→ retrying batch $current (attempt $next_retry, err_pct=$err_pct% missing=$missing)"
          else
            next=$(printf "%03d" $((10#$current + 1)))
            next_retry=0
            if [ "$retry_needed" = "true" ]; then
              echo "::warning::batch $current still defective after $retry_count retries (err_pct=$err_pct% missing=$missing) — advancing anyway"
            fi
            echo "→ advancing from $current to $next (err_pct=$err_pct% missing=$missing)"
          fi
          if [ -f "batches-public/batch-${next}.csv" ]; then
            # worker_count MUST be forwarded: without it the chain silently
            # reverts to the prepare-step floor on every batch after the first.
            gh workflow run scrape.yml \
              -f batch_label="${next}" \
              -f worker_count=${{ inputs.worker_count }} \
              -f max_age_weeks=${{ inputs.max_age_weeks }} \
              -f workers_per_runner=${{ inputs.workers_per_runner }} \
              -f retry_count=${next_retry}
          else
            echo "no batches-public/batch-${next}.csv — chain complete"
          fi
